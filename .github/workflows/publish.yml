# Publishes to npm on every push to master when the version in package.json
# isn't on npm yet, so to release, bump the version in your PR. The full
# checks.yml suite (build, lint, types, unit/DOM/browser tests) runs first,
# and nothing publishes unless all of it passes.
#
# Auth is npm trusted publishing (OIDC): no npm token is stored in GitHub.
# npmjs.com must list this repo and workflow file (publish.yml) as a trusted
# publisher with direct publishing allowed. Keep this filename, since that
# setting refers to it.
name: Publish
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.detect.outputs.pending }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        name: Check whether this version is on npm yet
        run: |
          id="$(jq -r .name package.json)@$(jq -r .version package.json)"
          if npm view "$id" version >/dev/null 2>&1; then
            echo "$id is already on npm"
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "$id will be published"
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: detect
    if: needs.detect.outputs.pending == 'true'
    uses: ./.github/workflows/checks.yml

  publish:
    needs: [detect, checks]
    if: needs.detect.outputs.pending == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run install
      - name: Publish to npm
        run: |
          version=$(jq -r .version package.json)
          # Prereleases (1.2.0-beta.1) go to the "next" dist-tag, not "latest".
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          npm publish --tag "$tag"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes "${flags[@]}"
